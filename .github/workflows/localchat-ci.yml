name: LocalChat verification

on:
  push:
    branches: [localchat]
  pull_request:
    branches: [localchat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localchat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.9'
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            output: app/build/windows/x64/runner/Debug/
          - os: ubuntu-24.04
            platform: linux
            output: app/build/linux/x64/debug/bundle/
          - os: macos-15
            platform: macos
            output: app/build/macos/Build/Products/Debug/LocalChat.app/
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
      FLUTTER_XCODE_CODE_SIGNING_REQUIRED: 'NO'
      FLUTTER_XCODE_CODE_SIGN_IDENTITY: ''
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev xvfb
      - uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Fixed Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - run: flutter pub get
        working-directory: app
      - name: Build native bridge for tests
        run: cargo build --locked -p rust_lib_localsend_app
      - name: App analysis
        run: flutter analyze --no-pub
        working-directory: app
      - name: App tests
        run: flutter test --no-pub
        working-directory: app
      - name: Isolates analysis
        run: flutter analyze --no-pub
        working-directory: packages/localsend_isolates
      - name: Isolates tests
        run: flutter test --no-pub
        working-directory: packages/localsend_isolates
      - name: Core tests and consumers
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p localsend --features full
          cargo clippy --locked -p localsend --features full --all-targets
          cargo test --locked -p rust_lib_localsend_app
          cargo check --locked -p rust_lib_localsend_app -p localsend-cli
      - name: Native SQLite smoke test
        if: runner.os != 'Linux'
        run: flutter test integration_test/localchat_smoke_test.dart -d ${{ matrix.platform }} --no-pub
        working-directory: app
      - name: Native SQLite smoke test (Linux display)
        if: runner.os == 'Linux'
        run: xvfb-run -a flutter test integration_test/localchat_smoke_test.dart -d linux --no-pub
        working-directory: app
      # Integration tests replace the executable entrypoint. Build the product
      # again afterward so the uploaded artifact is LocalChat, not the test app.
      - name: Desktop debug build
        run: flutter build ${{ matrix.platform }} --debug --no-pub
        working-directory: app
      - uses: actions/upload-artifact@v6
        with:
          name: localchat-${{ matrix.platform }}-debug-unsigned
          path: ${{ matrix.output }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: rustup toolchain install 1.97.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Android SDK and NDK
        run: sdkmanager 'platforms;android-36' 'ndk;28.2.13676358'
      - name: FOSS dependency configuration
        run: sh support/scripts/remove_proprietary_dependencies.sh
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --debug --target-platform android-arm64
        working-directory: app
      - uses: actions/upload-artifact@v6
        with:
          name: localchat-android-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: rustup toolchain install 1.97.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: flutter pub get
        working-directory: app
      - run: flutter build ios --debug --no-codesign
        working-directory: app
      - uses: actions/upload-artifact@v6
        with:
          name: localchat-ios-debug-unsigned
          path: app/build/ios/iphoneos/Runner.app/
          if-no-files-found: error
